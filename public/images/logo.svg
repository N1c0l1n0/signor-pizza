<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none" role="img" aria-label="Signor Pizza Logo">
  <defs>
    <!-- Bowtie gradients for depth and premium quality -->
    <linearGradient id="bowGradientLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="60%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </linearGradient>
    <linearGradient id="bowGradientRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="60%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </linearGradient>
    <linearGradient id="bowKnot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="50%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F3E9D9"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Top diagonal corner pins / straps -->
  <path d="M 44 26 L 34 8" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 156 26 L 166 8" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Outer Black Tuxedo Jacket (Pizza Slice Silhouette) -->
  <path d="M 64 16 
           C 78 12, 122 12, 136 16 
           L 165 42 
           C 162 90, 142 165, 106 208 
           L 106 215
           C 112 218, 114 225, 109 231
           C 105 236, 95 236, 91 231
           C 86 225, 88 218, 94 215
           L 94 208
           C 58 165, 38 90, 35 42 
           Z" 
        fill="#141414" 
        stroke="#141414" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- White Outer Lapel Framing / Piping -->
  <path d="M 64 20 
           L 39 44 
           C 42 90, 61 162, 95 204 
           L 95 214
           C 90 216, 88 222, 92 228
           C 95 232, 105 232, 108 228
           C 112 222, 110 216, 105 214
           L 105 204
           C 139 162, 158 90, 161 44 
           L 136 20
           Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linejoin="round"/>

  <!-- Inner Lapel Shadow / Contrast Line -->
  <path d="M 53 45 C 55 90, 72 150, 97 195" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 147 45 C 145 90, 128 150, 103 195" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Cream Shirtfront Triangle -->
  <path d="M 72 26 
           L 128 26 
           C 126 70, 114 135, 100 196 
           C 86 135, 74 70, 72 26 
           Z" 
        fill="url(#shirtGrad)" 
        stroke="#141414" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Shirt Collar Points -->
  <polygon points="68,26 84,48 94,28" fill="#FFFFFF" stroke="#141414" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="132,26 116,48 106,28" fill="#FFFFFF" stroke="#141414" stroke-width="2" stroke-linejoin="round"/>

  <!-- Bottom Tip Center Dot (Medal / Olive Detail) -->
  <circle cx="100" cy="225" r="2.8" fill="#FFFFFF"/>

  <!-- 4 Tuxedo Buttons -->
  <circle cx="100" cy="74" r="4.2" fill="#141414"/>
  <circle cx="100" cy="73" r="1.2" fill="#404040"/>

  <circle cx="100" cy="107" r="4.2" fill="#141414"/>
  <circle cx="100" cy="106" r="1.2" fill="#404040"/>

  <circle cx="100" cy="140" r="4.2" fill="#141414"/>
  <circle cx="100" cy="139" r="1.2" fill="#404040"/>

  <circle cx="100" cy="173" r="4.2" fill="#141414"/>
  <circle cx="100" cy="172" r="1.2" fill="#404040"/>

  <!-- Bowtie (Farfallino / Papillon) -->
  <g filter="url(#subtleShadow)">
    <!-- Left Wing -->
    <path d="M 100 28 
             C 96 28, 64 12, 60 16 
             C 56 20, 56 36, 60 40 
             C 65 44, 95 34, 100 32 
             Z" 
          fill="url(#bowGradientLeft)" 
          stroke="#5C0000" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>
    <!-- Left Wing Fold Lines -->
    <path d="M 64 22 C 72 26, 88 28, 97 29" stroke="#FFA4A2" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 64 34 C 74 32, 88 31, 97 31" stroke="#4A0000" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Wing -->
    <path d="M 100 28 
             C 104 28, 136 12, 140 16 
             C 144 20, 144 36, 140 40 
             C 135 44, 105 34, 100 32 
             Z" 
          fill="url(#bowGradientRight)" 
          stroke="#5C0000" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>
    <!-- Right Wing Fold Lines -->
    <path d="M 136 22 C 128 26, 112 28, 103 29" stroke="#FFA4A2" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 136 34 C 126 32, 112 31, 103 31" stroke="#4A0000" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- Center Knot -->
    <rect x="92" y="21" width="16" height="17" rx="4" 
          fill="url(#bowKnot)" 
          stroke="#4A0000" 
          stroke-width="1.5"/>
    <path d="M 94 25 C 97 23, 103 23, 106 25" stroke="#FFA4A2" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <path d="M 94 33 C 97 35, 103 35, 106 33" stroke="#4A0000" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
